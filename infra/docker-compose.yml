services:
  api:
    build:
      context: ../services/api
    env_file:
      - ../services/api/.env
    ports:
      - "8000:8000"
    environment:
      LANXIN_DATABASE_URL: postgresql+psycopg://lanxin:lanxin_dev@postgres:5432/lanxin_travelmate
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lanxin_travelmate
      POSTGRES_USER: lanxin
      POSTGRES_PASSWORD: lanxin_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanxin -d lanxin_travelmate"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    profiles:
      - placeholder

volumes:
  postgres_data:
