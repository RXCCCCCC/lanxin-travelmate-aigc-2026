name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --concurrency=1

  api:
    name: Python pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync API dependencies
        run: uv sync --dev

      - name: Run API tests
        run: uv run pytest

  real-provider-smoke:
    name: Real provider smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      LANXIN_AMAP_API_KEY: ${{ secrets.LANXIN_AMAP_API_KEY }}
      LANXIN_MODEL_PROVIDER: ${{ secrets.LANXIN_MODEL_PROVIDER }}
      LANXIN_LANXIN_BASE_URL: ${{ secrets.LANXIN_LANXIN_BASE_URL }}
      LANXIN_LANXIN_API_KEY: ${{ secrets.LANXIN_LANXIN_API_KEY }}
      LANXIN_LANXIN_MODEL: ${{ secrets.LANXIN_LANXIN_MODEL }}
      LANXIN_OPENAI_BASE_URL: ${{ secrets.LANXIN_OPENAI_BASE_URL }}
      LANXIN_OPENAI_API_KEY: ${{ secrets.LANXIN_OPENAI_API_KEY }}
      LANXIN_OPENAI_MODEL: ${{ secrets.LANXIN_OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Report smoke gate
        run: echo "Real provider smoke runs only when matching secrets are configured."

      - name: Install uv
        if: >-
          ${{
            env.LANXIN_AMAP_API_KEY != '' ||
            (env.LANXIN_MODEL_PROVIDER == 'lanxin' && env.LANXIN_LANXIN_BASE_URL != '' && env.LANXIN_LANXIN_API_KEY != '') ||
            ((env.LANXIN_MODEL_PROVIDER == 'openai' || env.LANXIN_MODEL_PROVIDER == 'openai_compatible' || env.LANXIN_MODEL_PROVIDER == 'openai-compatible') && env.LANXIN_OPENAI_BASE_URL != '' && env.LANXIN_OPENAI_API_KEY != '')
          }}
        uses: astral-sh/setup-uv@v6

      - name: Sync API dependencies
        if: >-
          ${{
            env.LANXIN_AMAP_API_KEY != '' ||
            (env.LANXIN_MODEL_PROVIDER == 'lanxin' && env.LANXIN_LANXIN_BASE_URL != '' && env.LANXIN_LANXIN_API_KEY != '') ||
            ((env.LANXIN_MODEL_PROVIDER == 'openai' || env.LANXIN_MODEL_PROVIDER == 'openai_compatible' || env.LANXIN_MODEL_PROVIDER == 'openai-compatible') && env.LANXIN_OPENAI_BASE_URL != '' && env.LANXIN_OPENAI_API_KEY != '')
          }}
        run: uv sync --dev

      - name: Run real provider smoke
        if: >-
          ${{
            env.LANXIN_AMAP_API_KEY != '' ||
            (env.LANXIN_MODEL_PROVIDER == 'lanxin' && env.LANXIN_LANXIN_BASE_URL != '' && env.LANXIN_LANXIN_API_KEY != '') ||
            ((env.LANXIN_MODEL_PROVIDER == 'openai' || env.LANXIN_MODEL_PROVIDER == 'openai_compatible' || env.LANXIN_MODEL_PROVIDER == 'openai-compatible') && env.LANXIN_OPENAI_BASE_URL != '' && env.LANXIN_OPENAI_API_KEY != '')
          }}
        run: uv run python scripts/real_provider_smoke.py
  android-apk:
    name: Android debug APK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Android release preflight
        working-directory: .
        run: python scripts/android_release_preflight.py --strict

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t lanxin-travelmate-api ./services/api
